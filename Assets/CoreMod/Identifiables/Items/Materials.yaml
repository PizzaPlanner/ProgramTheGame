API:
- !Mod
  Tag:       [!Tag { }]
  Mod:       [!Tag { }]

Locations:
  ExampleAsteroidField:
    Generator:
      CombineArea:
        Density: 0.5
        MinSize: [72, 72]
    SubNodes:
      BigAsteroid: 0.1
      SmallAsteroid: 0.4

  SmallAsteroid:
    Generator:
      SelectOne:
    SubNodes:
      SmallAsteroidA: 0.3
      SmallAsteroidB: 0.3
      SmallAsteroidCopper: 0.1

  SmallAsteroidA:
    Generator:
      PerlinShape:
        MinSize: [7, 7]
        MaxSize: [12, 12]
        NoiseScale: 0.3
    SubNodes:
      TileRock: 0.1
      TileDirt: 0.3
      TileCopper: 0.02

  SmallAsteroidB:
    Generator:
      PerlinShape:
        MinSize: [7, 7]
        MaxSize: [12, 12]
        NoiseScale: 0.4
    SubNodes:
      TileRock: 0.3
      TileDirt: 0.1
      TileCopper: 0.02

  SmallAsteroidCopper:
    Generator:
      PerlinShape:
        MinSize: [7, 7]
        MaxSize: [12, 12]
        NoiseScale: 0.3
    SubNodes:
      TileCopper: 1



Core:
- !Mod
  Spawnable: [!Tag { }]
  Item:      [!Tag { Implies: [Spawnable] }]
  Solid:     [!Tag { Implies: [Item], Conflicts: [Liquid, Gas] }]
  Liquid:    [!Tag { Implies: [Item], Conflicts: [Solid, Gas] }]
  Gas:       [!Tag { Implies: [Item], Conflicts: [Solid, Liquid] }]
  UnitDispenser:
  - !Tag
    Implies: [Worker]
    Fields:
    - Name: UnitType
      Type: Id[Unit]
    - Name: DispenseTask
      Type: Id[DispenseUnitTask]


  Hungry:
  - !Status
    MoodChange: -3
    StackPolicy: Discard

  BreatheTask: [ !BreatheTask { } ]
  DispenseUnitTask:
  - !Task
    MinSkillLevel: 2
    RequiredSkill: SkillHack
    UniquenessGroup: DispenseUnitTask
  - !DispenseUnitTask
    RequiredTicks: 25

  CryoTank:
  - !Building
    Layer: Building
    PlacementType: Single
    CanRotate: true
  - !UnitDispenser
    UnitType: Colonist
    DispenseTask: DispenseUnitTask
    StatusAddedOnDispsense: FinallyAwake

  Wall:
  - !Building
    Layer: Wall
    PlacementType: Border
    GridSize: [1, 1]
    RemovalTask: DeconstructTask
    Construction:
      Duration: 3
      FixedMaterials: []
      Variants:
      - Silicon
      - IronOre
      - CopperOre
  - !DefaultMass
    Element: Silicon
    Mass: 400kg
    Temperature: 25C


  CoalOre:
  - !Solid
    TC: 3
    SHC: 1.4
    Melts: { To: Dirt, At: 290 }
  
  Voidite:
  - !Solid 
    SHC: .inf
    Melts: { To: VACUUM, At: 0.5K }
  
  CopperLiquid:
  - !Liquid
    Melts: { To: CopperGas, At: 2400C }
    Freezes: { To: CopperIngot, At: 1200C }
      
  CopperIngot:
  - !Solid
    Melts: { To: CopperLiquid, At: 1200C }
  - !Recipe
    Duration: 5
    Inputs:
      CopperOre: 2
    Outputs:
      CopperIngot: 1
    CraftedIn: [ Furnace, ElectricFurnace, Smelter ]
  
  CopperOre:
  - !Solid
    Melts: { To: CopperLiquid, At: 1200C }
  
  CopperGas:
  - !Gas
    Freezes: { To: CopperLiquid, At: 1200C }
  
  Water:
  - !Liquid
    TC: 2
    SHC: 4.184
    Freezes: { To: Ice, At: -4C }
    Melts: { To: Steam, At: 100C }

  Ice:
  - !Solid
    TC: 0.4
    SHC: 4.184
    Melts: { To: Water, At: -4C }

  Steam:
  - !Gas
    TC: 0.4
    SHC: 4.184
    Freezes: { To: Water, At: 100C }
  
